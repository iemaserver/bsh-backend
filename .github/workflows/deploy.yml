name: Deploy to GCP VM

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # GitHub Actions evaluates ${{ secrets.* }} expressions before the script
      # is sent over SSH. Values are masked (***) in the Actions log. The single-
      # quoted heredoc ('EOF') prevents any shell expansion on the remote side,
      # so special characters in values are written verbatim.
      - name: Write .env file on VM
        uses: appleboy/ssh-action@v1.2.5
        with:
          host:     ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key:      ${{ secrets.VM_SSH_KEY }}
          port:     ${{ secrets.VM_SSH_PORT || 22 }}
          script: |
            cat > /var/www/iem-bsh/.env << 'EOF'
            PORT=${{ secrets.PORT }}
            NODE_ENV=${{ secrets.NODE_ENV }}
            UPLOAD_DIR=${{ secrets.UPLOAD_DIR }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_ALGORITHM=${{ secrets.JWT_ALGORITHM }}
            ACCESS_TOKEN_EXPIRE_MINUTES=${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}
            ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }}
            ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
            CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            DIRECT_URL=${{ secrets.DIRECT_URL }}
            EMAIL_USER=${{ secrets.EMAIL_USER }}
            EMAIL_PASS=${{ secrets.EMAIL_PASS }}
            ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}
            ADMIN_EMAIL2=${{ secrets.ADMIN_EMAIL2 }}
            EOF
            chmod 600 /var/www/iem-bsh/.env

      # No checkout needed — the VM pulls from git itself in deploy.sh.
      - name: SSH and run deploy script
        uses: appleboy/ssh-action@v1.2.5
        with:
          host:     ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key:      ${{ secrets.VM_SSH_KEY }}
          port:     ${{ secrets.VM_SSH_PORT || 22 }}
          script: |
            bash /var/www/iem-bsh/deploy/deploy.sh
